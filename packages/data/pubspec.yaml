name: flutter_boilerplate_data
description: Data implementations, repositories, and datasources for Flutter boilerplate features.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Package dependencies
  flutter_boilerplate_core:
    path: ../core
  flutter_boilerplate_domain:
    path: ../domain

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.1.0

  # Networking
  dio: ^4.0.0
  retrofit: ^3.0.0

  # Local Storage
  shared_preferences: ^2.0.0
  hive: ^2.2.0
  hive_flutter: ^1.0.0

  # Freezed & JSON
  freezed_annotation: ^2.2.0
  json_annotation: 4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^5.1.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  json_serializable: ^6.7.0
  retrofit_generator: ^4.0.0+1
  injectable_generator: ^2.0.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true
