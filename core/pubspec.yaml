name: flutter_boilerplate_core
description: Core utilities, failures, extensions, theme, and constants for Flutter boilerplate.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  bloc: ^8.1.4
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_boilerplate_data:
    path: ../data
  flutter_boilerplate_domain:
    path: ../domain
  flutter_screenutil: ^5.9.3
  get_it: ^8.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  injectable: ^2.5.0
  intl: ^0.19.0
  logger: ^2.4.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
