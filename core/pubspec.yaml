name: flutter_boilerplate_core
description: Core utilities, failures, extensions, theme, and constants for Flutter boilerplate.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.3 <4.0.0'

dependencies:
  bloc: ^7.2.0
  cupertino_icons: ^1.0.8
  dio: ^4.0.0
  equatable: ^2.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^7.1.0
  flutter_boilerplate_data:
    path: ../data
  flutter_boilerplate_domain:
    path: ../domain
  flutter_screenutil: ^5.9.0
  get_it: ^7.6.7
  hive: ^2.2.0
  hive_flutter: ^1.0.0
  injectable: ^2.1.0
  intl: ^0.18.1
  logger: ^1.4.0
  shared_preferences: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
