name: flutter_boilerplate_data
description: Data implementations, repositories, and datasources for Flutter boilerplate features.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.3 <4.0.0'

dependencies:
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_boilerplate_core:
    path: ../core
  flutter_boilerplate_domain:
    path: ../domain
  freezed_annotation: ^2.2.0
  get_it: ^7.6.7
  hive: ^2.2.0
  hive_flutter: ^1.0.0
  injectable: ^2.1.0
  json_annotation: ^4.9.0
  retrofit: '>=4.0.0 <4.9.0'
  shared_preferences: ^2.0.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  injectable_generator: ^2.0.0
  json_serializable: ^6.9.0
  mockito: ^5.4.0
  retrofit_generator: ^9.7.0
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
